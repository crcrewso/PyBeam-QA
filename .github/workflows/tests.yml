# PyBeam QA's tests (tests/gui and tests/unit), headless, on the locked dependency set (requirements.txt).
# See tests/gui/README.md. Test-only: this workflow publishes nothing and needs no secrets.
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            tests/gui/requirements.txt

      - name: Qt's system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install the locked dependencies and the test tools
        run: |
          python -m pip install -r tests/gui/requirements.txt
          python -m pip install -c requirements.txt "FauxPID @ git+https://github.com/crcrewso/linac-dicom-image-suite.git@1014da2"

      - name: Locate pylinac's demo-file cache
        id: demo
        shell: python
        run: |
          import os, pylinac
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"dir={os.path.join(os.path.dirname(pylinac.__file__), 'demo_files')}\n")
              out.write(f"pylinac={pylinac.__version__}\n")

      - name: Cache pylinac's demo files (CatPhan series, downloaded on first use)
        uses: actions/cache@v6
        with:
          path: ${{ steps.demo.outputs.dir }}
          key: pylinac-demo-files-${{ runner.os }}-${{ steps.demo.outputs.pylinac }}-v1

      - name: Run the tests
        run: python -m pytest tests -q -rfEx -p no:cacheprovider
