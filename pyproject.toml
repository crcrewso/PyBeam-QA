[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pybeam-qa"
version = "0.1.2"
description = "A graphical user interface program for performing quality assurance tests in radiotherapy"
readme = "README.md"
authors = [
    {name = "Kagiso Lebang", email = "lebangk@gmail.com"}
]
license = {text = "GPL-3.0-or-later"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: OS Independent",
    "Intended Audience :: Healthcare Industry",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Physics",
]
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.4.0",
    "PySide6-utils>=1.2.0",
    "pylinac>=3.22.0",
    "pyqtgraph>=0.13.3",
    "pdfrw==0.4",
    "matplotlib>=3.5.0",
    "numpy>=1.20.0",
    "scipy>=1.7.0",
    "reportlab>=3.6.0",
]

[project.urls]
"Homepage" = "https://github.com/Quantico-Bullet/PyBeam-QA"
"Bug Tracker" = "https://github.com/Quantico-Bullet/PyBeam-QA/issues"

[project.scripts]
pybeam-qa = "main:main"

[project.optional-dependencies]
dev = [
    "ruff>=0.1.6",
    "black>=23.11.0",
    "pytest>=7.4.3",
    "pytest-cov>=4.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["core", "ui"]

[tool.hatch.build.targets.sdist]
include = [
    "core/**/*.py",
    "ui/**/*.py",
    "ui/**/*.ui",
    "ui/**/icons/*",
]

[tool.ruff]
line-length = 100
target-version = "py310"
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.isort]
known-first-party = ["core", "ui"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"

[tool.uv]
python = "3.10"
